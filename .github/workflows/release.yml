name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  # write access to GitHub Packages, used as the vcpkg binary cache (NuGet feed)
  packages: write

env:
  VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
  VCPKG_EXE: ${{ github.workspace }}/.vcpkg/vcpkg
  VCPKG_NUGET_FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
  # VCPKG_BINARY_SOURCES is set by the setup-vcpkg action (GITHUB_ENV): NuGet cache
  # where mono/nuget is available, disabled (clear) on runners where mono is not installable

jobs:
  semantic-release:
    name: semantic-release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.sr.outputs.released }}
      version: ${{ steps.sr.outputs.version }}
    steps:
      # Checkout with the PAT: the persisted git credential (http extraheader) takes
      # precedence over the token embedded in semantic-release's push URL. Without this,
      # the release commit is pushed as github-actions[bot] (GITHUB_TOKEN) and rejected
      # by the `main` ruleset (GH013). With the PAT, the push is authenticated as its
      # owner, a bypass actor of the ruleset.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Set git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install python-semantic-release
        run: pip install python-semantic-release

      - name: Semantic release
        id: sr
        # RELEASE_PAT: fine-grained PAT (Contents read/write, this repo only). Its owner is a
        # bypass actor of the `main` ruleset, so the release commit can bypass the PR rule.
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          before=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          semantic-release version
          after=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          if [ "$before" != "$after" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=${after#v}" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  publish-npm:
    name: publish-npm
    needs: semantic-release
    if: needs.semantic-release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.semantic-release.outputs.version }}

      # setup-node writes .npmrc with //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com/"

      # version in client/npm/package.json is synced by semantic-release's build_command.
      # The ./ prefix is required: without it npm treats "client/npm" as a GitHub
      # user/repo shorthand (git ls-remote ssh://git@github.com/client/npm.git, exit 128)
      - name: Publish @theo-dep/tunnelpp to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish ./client/npm --access public

  # Tags checked out at v{version} (not the triggering push): GITHUB_REF is still refs/heads/main,
  # so metadata-action's type=semver cannot match. Tags are computed from the release version instead.
  # provenance/sbom are disabled: their attestation manifests are pushed by digest without platform
  # (GHCR lists them as untagged unknown/unknown entries).
  # The Dockerfile packages the release binary (downloaded by build-arg VERSION) instead of
  # compiling: it needs the "build" matrix assets to be uploaded to the release first.
  publish-docker:
    name: publish-docker
    needs: [semantic-release, build]
    if: needs.semantic-release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.semantic-release.outputs.version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          VERSION: ${{ needs.semantic-release.outputs.version }}
        run: |
          set -euo pipefail
          tags="ghcr.io/theo-dep/tunnelpp:${VERSION}"
          # Prereleases (0.1.0-alpha.1) only get the full version tag:
          # rolling tags (0.1, latest) are reserved for stable releases.
          if [[ "$VERSION" != *"-"* ]]; then
            tags="${tags},ghcr.io/theo-dep/tunnelpp:${VERSION%.*},ghcr.io/theo-dep/tunnelpp:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.semantic-release.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=tunnelpp
            org.opencontainers.image.description=Tunnelpp server image
            org.opencontainers.image.version=${{ needs.semantic-release.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  build:
    name: build (${{ matrix.target }})
    needs: semantic-release
    if: needs.semantic-release.outputs.released == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux — Ubuntu 26.04 (last)
          - { os: ubuntu-26.04, target: linux-x64 }
          - { os: ubuntu-26.04-arm, target: linux-arm64 }
          # Linux — Ubuntu 24.04 (OS-1)
          - { os: ubuntu-24.04, target: linux-x64-ubuntu24 }
          - { os: ubuntu-24.04-arm, target: linux-arm64-ubuntu24 }
          # macOS — macOS 26 (last)
          - { os: macos-latest, target: darwin-arm64 }
          # macOS — macOS 15 (OS-1)
          - { os: macos-15, target: darwin-arm64-macos15 }
          # macOS Intel x86_64 — macOS 26 (last)
          - { os: macos-26-intel, target: darwin-x64 }
          # macOS Intel x86_64 — macOS 15 (OS-1)
          - { os: macos-15-intel, target: darwin-x64-macos15 }
          # Windows — Server 2025 / Windows 11 (last)
          - { os: windows-latest, target: win32-x64 }
          - { os: windows-11-arm, target: win32-arm64 }
          # Windows — Server 2022 (OS-1)
          - { os: windows-2022, target: win32-x64-win2022 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.semantic-release.outputs.version }}

      - name: Install Ninja and Clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang zip

      - name: Set up Clang (Windows)
        if: runner.os == 'Windows'
        run: echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"
        shell: bash

      # macOS: clang and ninja are preinstalled

      - name: Set up vcpkg (NuGet binary cache)
        uses: ./.github/actions/setup-vcpkg
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure
        run: cmake --preset clang

      - name: Build
        run: cmake --build --preset clang-release

      # zip is not available in Git Bash on Windows runners (exit 127): use Compress-Archive
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/clang/client/Release/tunnelpp-client.exe -DestinationPath "dist/tunnelpp-client-$env:TARGET.zip"
          Compress-Archive -Path build/clang/server/Release/tunnelpp-server.exe -DestinationPath "dist/tunnelpp-server-$env:TARGET.zip"

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "$GITHUB_WORKSPACE/dist/tunnelpp-client-$TARGET.tar.gz" -C build/clang/client/Release tunnelpp-client
          tar -czf "$GITHUB_WORKSPACE/dist/tunnelpp-server-$TARGET.tar.gz" -C build/clang/server/Release tunnelpp-server

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          tag_name: v${{ needs.semantic-release.outputs.version }}
