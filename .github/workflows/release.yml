name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  # write access to GitHub Packages, used as the vcpkg binary cache (NuGet feed)
  packages: write

env:
  VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
  VCPKG_EXE: ${{ github.workspace }}/.vcpkg/vcpkg
  VCPKG_NUGET_FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
  # VCPKG_BINARY_SOURCES is set by the setup-vcpkg action (GITHUB_ENV): NuGet cache
  # where mono/nuget is available, disabled (clear) on runners where mono is not installable

jobs:
  semantic-release:
    name: semantic-release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.sr.outputs.released }}
      version: ${{ steps.sr.outputs.version }}
    steps:
      # GitHub App token: the release commit/tag push and the GitHub release are
      # authenticated as the app bot (e.g. semantic-release-bot[bot]), which must be a
      # bypass actor of the `main` ruleset — no personal PAT (RELEASE_PAT) involved.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          # @semantic-release/github comments on the PRs/issues included in the release
          permission-pull-requests: write
          permission-issues: write

      # Checkout with the app token: the persisted git credential (http extraheader) is
      # used by semantic-release's push, so the release commit is pushed as the bot.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set git config
        run: |
          git config user.name "semantic-release-bot[bot]"
          git config user.email "semantic-release-bot[bot]@users.noreply.github.com"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install semantic-release
        run: npm ci

      - name: Semantic release
        id: sr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          before=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          npx semantic-release
          after=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          if [ "$before" != "$after" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=${after#v}" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  publish-npm:
    name: publish-npm
    needs: semantic-release
    if: needs.semantic-release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.semantic-release.outputs.version }}

      # setup-node writes .npmrc with //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com/"

      # client/npm/package.json has no version in the repo (single source of truth: version.txt,
      # bumped by semantic-release in the release commit). Set it here:
      # client/npm/scripts/install.js reads it to build the release asset URL (v{version}).
      - name: Set client package version
        env:
          VERSION: ${{ needs.semantic-release.outputs.version }}
        run: npm version --no-git-tag-version "$VERSION" --prefix client/npm

      # The ./ prefix is required: without it npm treats "client/npm" as a GitHub
      # user/repo shorthand (git ls-remote ssh://git@github.com/client/npm.git, exit 128)
      - name: Publish @theo-dep/tunnelpp to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish ./client/npm --access public

  # Tags checked out at v{version} (not the triggering push): GITHUB_REF is still refs/heads/main,
  # so metadata-action's type=semver cannot match. Tags are computed from the release version instead.
  # provenance/sbom are disabled: their attestation manifests are pushed by digest without platform
  # (GHCR lists them as untagged unknown/unknown entries).
  # The Dockerfile packages the release binary (downloaded by build-arg VERSION) instead of
  # compiling: it needs the "build" matrix assets to be uploaded to the release first.
  publish-docker:
    name: publish-docker
    needs: [semantic-release, build]
    if: needs.semantic-release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.semantic-release.outputs.version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          VERSION: ${{ needs.semantic-release.outputs.version }}
        run: |
          set -euo pipefail
          tags="ghcr.io/theo-dep/tunnelpp:${VERSION}"
          # Prereleases (0.1.0-alpha.1) only get the full version tag:
          # rolling tags (0.1, latest) are reserved for stable releases.
          if [[ "$VERSION" != *"-"* ]]; then
            tags="${tags},ghcr.io/theo-dep/tunnelpp:${VERSION%.*},ghcr.io/theo-dep/tunnelpp:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.semantic-release.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=tunnelpp
            org.opencontainers.image.description=Tunnelpp server image
            org.opencontainers.image.version=${{ needs.semantic-release.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  build:
    name: build (${{ matrix.target }})
    needs: semantic-release
    if: needs.semantic-release.outputs.released == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux — Ubuntu 26.04 (last)
          - { os: ubuntu-26.04, target: linux-x64 }
          - { os: ubuntu-26.04-arm, target: linux-arm64 }
          # Linux — Ubuntu 24.04 (OS-1)
          - { os: ubuntu-24.04, target: linux-x64-ubuntu24 }
          - { os: ubuntu-24.04-arm, target: linux-arm64-ubuntu24 }
          # macOS — macOS 26 (last)
          - { os: macos-latest, target: darwin-arm64 }
          # macOS — macOS 15 (OS-1)
          - { os: macos-15, target: darwin-arm64-macos15 }
          # macOS Intel x86_64 — macOS 26 (last)
          - { os: macos-26-intel, target: darwin-x64 }
          # macOS Intel x86_64 — macOS 15 (OS-1)
          - { os: macos-15-intel, target: darwin-x64-macos15 }
          # Windows — Server 2025 / Windows 11 (last)
          - { os: windows-latest, target: win32-x64 }
          - { os: windows-11-arm, target: win32-arm64 }
          # Windows — Server 2022 (OS-1)
          - { os: windows-2022, target: win32-x64-win2022 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.semantic-release.outputs.version }}

      - name: Install Ninja and Clang (Linux)
        if: runner.os == 'Linux'
        run: |
          # The amd64v3 libc6-dev on ubuntu-26.04 runners marks every linked binary x86-64-v3 via
          # its crt1.o note: pin the baseline amd64 variant and reinstall the toolchain from it.
          echo 'APT::Architecture-Variants "amd64";' | sudo tee /etc/apt/apt.conf.d/99-amd64-baseline
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades --reinstall ninja-build clang zip libc6-dev

      - name: Set up Clang (Windows)
        if: runner.os == 'Windows'
        run: echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"
        shell: bash

      # macOS: clang and ninja are preinstalled

      - name: Set up vcpkg (NuGet binary cache)
        uses: ./.github/actions/setup-vcpkg
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure
        run: cmake --preset clang

      - name: Build
        run: cmake --build --preset clang-release

      # Fail if a linux x64 asset is not x86-64 baseline: -march flags, ymm/zmm code, or a v2/v3
      # GNU property note (glibc refuses to start such binaries on CPUs without AVX2).
      - name: Check x86-64 baseline (linux x64)
        if: matrix.target == 'linux-x64' || matrix.target == 'linux-x64-ubuntu24'
        shell: bash
        run: |
          set -euo pipefail
          march="$(jq -r '.[].command' build/clang/compile_commands.json | grep -o -- '-march=[^ "]*' | sort -u)"
          echo "compile -march flags: ${march}"
          [ "${march}" = "-march=x86-64" ]
          if find build/clang -name '*.o' -path '*CMakeFiles*' -exec objdump -d {} + | grep -qE '%(y|z)mm'; then
            echo "project objects contain AVX/AVX2 (ymm/zmm) instructions: not x86-64 baseline" >&2
            exit 1
          fi
          for bin in build/clang/server/Release/tunnelpp-server build/clang/client/Release/tunnelpp-client; do
            notes="$(readelf -nW "$bin")"
            echo "$notes" | grep 'x86 ISA needed' || true
            if echo "$notes" | grep -qE 'x86 ISA needed:.*x86-64-v[2-9]'; then
              echo "$bin is marked for an ISA level above the x86-64 baseline" >&2
              exit 1
            fi
          done

      # zip is not available in Git Bash on Windows runners (exit 127): use Compress-Archive
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/clang/client/Release/tunnelpp-client.exe -DestinationPath "dist/tunnelpp-client-$env:TARGET.zip"
          Compress-Archive -Path build/clang/server/Release/tunnelpp-server.exe -DestinationPath "dist/tunnelpp-server-$env:TARGET.zip"

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "$GITHUB_WORKSPACE/dist/tunnelpp-client-$TARGET.tar.gz" -C build/clang/client/Release tunnelpp-client
          tar -czf "$GITHUB_WORKSPACE/dist/tunnelpp-server-$TARGET.tar.gz" -C build/clang/server/Release tunnelpp-server

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          tag_name: v${{ needs.semantic-release.outputs.version }}
