site_name: tunnelpp
site_description: Expose local HTTP services on public subdomains through a tunnel server
site_url: https://theo-dep.github.io/tunnelpp/
repo_url: https://github.com/theo-dep/tunnelpp

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Overview: overview.md
  - Architecture: architecture.md
  - Protocol: protocol.md
  - Server: server.md
  - Dynamic IP: dynamic-ip.md
  - Client: client.md
  - Security: security.md
  - Development: development.md
  - API reference: api-reference.md
  - Roadmap: roadmap.md
