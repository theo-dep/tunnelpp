[project]
name = "tunnelpp"
version = "0.0.0"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
build_command = "sed -i 's/project(tunnelpp VERSION [^ ]*/project(tunnelpp VERSION '\"${NEW_VERSION%%-*}\"'/' CMakeLists.txt && sed -i 's/\"version-string\": \"[^\"]*\"/\"version-string\": \"'\"$NEW_VERSION\"'\"/' vcpkg.json && sed -i 's/\"version\": \"[^\"]*\"/\"version\": \"'\"$NEW_VERSION\"'\"/' client/npm/package.json && git add CMakeLists.txt vcpkg.json client/npm/package.json"
changelog_file = "CHANGELOG.md"
commit_message = "chore(release): {version} [skip ci]"
tag_format = "v{version}"
allow_zero_version = true
major_on_zero = false

[tool.semantic_release.branches.main]
match = "main"
prerelease = true
prerelease_token = "alpha"

[tool.semantic_release.changelog]
exclude_commit_patterns = ["^chore\\(release\\):"]

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "refactor", "revert", "style", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.remote]
type = "github"
